<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Squadron Logistics — Demo</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#202f48;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}header{background:#12243d;color:white;padding:22px 4vw;display:flex;justify-content:space-between;align-items:center}header strong{font-size:21px}header small{opacity:.7}main{max-width:1200px;margin:35px auto;padding:0 20px}.warn{background:#fff6e5;border:1px solid #f2d29b;border-radius:10px;padding:14px;margin:20px 0;color:#674a16}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px}.stat,.panel{background:white;border:1px solid #e0e6ef;border-radius:14px;padding:20px;box-shadow:0 8px 24px #20345109}.stat b{font-size:30px;display:block;margin-top:5px}.stat span{color:#718096}.panel{margin-top:22px;overflow-x:auto}h2{margin:0 0 18px}input,select,button{font:inherit;padding:9px 12px;border-radius:8px;border:1px solid #c8d3e2}button{background:#315fdb;color:white;border:0;cursor:pointer}button:disabled{background:#aab5cb}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}table{width:100%;border-collapse:collapse;text-align:left;min-width:600px}th,td{padding:13px 10px;border-bottom:1px solid #edf0f5}th{color:#6d7d95;font-size:12px;text-transform:uppercase}label{display:block;margin:10px 0 4px}dialog{border:0;border-radius:14px;padding:30px;width:min(500px,95%);box-shadow:0 30px 80px #1119}dialog::backdrop{background:#11253d99}dialog input,dialog select{width:100%}.actions{margin-top:20px;display:flex;gap:10px;justify-content:flex-end}.secondary{background:#e9eef6;color:#223a59}.muted{color:#7b8aa0}nav button{background:#223b60;margin:2px}
</style></head><body><header><div><strong>◆ Squadron Logistics</strong><div><small>OPERATIONS PROOF OF CONCEPT</small></div></div><nav><button onclick="showTab('inventory')">Inventory</button> <button onclick="showTab('loans')">Checkouts</button> <button onclick="showTab('orders')">Incoming</button></nav></header><main><h1>Logistics overview</h1><p class="muted">Fictional local demo • No live backend or authentication</p><div class="warn"><b>Demo only.</b> No real member information or CAP inventory should be entered. Data is stored only in this browser.</div><section class="stats" id="stats"></section><section class="panel"><div class="toolbar"><input id="search" placeholder="Search equipment or members…" oninput="render()"><button onclick="openAdd()">+ Add item</button><button class="secondary" onclick="exportCSV()">Export inventory</button><button class="secondary" onclick="reset()">Reset demo</button></div><h2 id="heading">Inventory</h2><div id="table"></div></section></main><dialog id="modal"><h2 id="modalTitle">Add item</h2><form id="form" onsubmit="submitForm(event)"><div id="fields"></div><div class="actions"><button type="button" class="secondary" onclick="modal.close()">Cancel</button><button>Save changes</button></div></form></dialog><script>
const seed={items:[{id:'EQ-001',name:'Handheld radio',category:'Communications',total:8},{id:'EQ-002',name:'Ground team pack',category:'Field Equipment',total:6},{id:'EQ-003',name:'ABU blouse · Medium',category:'Uniforms',total:24},{id:'EQ-004',name:'Safety vest',category:'Field Equipment',total:13}],loans:[{id:'LN-001',itemId:'EQ-001',member:'Miller',qty:2,date:'2026-10-24',returned:false}],orders:[{id:'PO-001',name:'Safety vests',qty:12,status:'Ordered'}]};
let data=JSON.parse(localStorage.getItem('cap-logistics-demo')||'null')||structuredClone(seed),tab='inventory',mode='add',selected='';
const save=()=>{localStorage.setItem('cap-logistics-demo',JSON.stringify(data));render()},today=()=>new Date().toISOString().slice(0,10),active=i=>data.loans.filter(l=>l.itemId===i&&!l.returned).reduce((t,l)=>t+l.qty,0),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function showTab(t){tab=t;render()}function render(){let issued=data.loans.filter(l=>!l.returned).reduce((t,l)=>t+l.qty,0);stats.innerHTML=[['Inventory types',data.items.length],['Total units',data.items.reduce((t,i)=>t+i.total,0)],['Units issued',issued],['Incoming orders',data.orders.filter(o=>o.status!=='Received').length]].map(([k,v])=>'<article class="stat"><span>'+k+'</span><b>'+v+'</b></article>').join('');heading.textContent=({inventory:'Inventory',loans:'Checkouts & returns',orders:'Incoming supplies'})[tab];let q=search.value.toLowerCase();if(tab==='inventory'){table.innerHTML='<table><tr><th>Equipment</th><th>Category</th><th>Total</th><th>Available</th><th>Actions</th></tr>'+data.items.filter(i=>(i.name+' '+i.id).toLowerCase().includes(q)).map(i=>'<tr><td><b>'+esc(i.name)+'</b><div class="muted">'+esc(i.id)+'</div></td><td>'+esc(i.category)+'</td><td>'+i.total+'</td><td>'+Math.max(0,i.total-active(i.id))+'</td><td><button onclick="openCheckout(\''+i.id+'\')">Check out</button></td></tr>').join('')+'</table>'}else if(tab==='loans'){table.innerHTML='<table><tr><th>Equipment</th><th>Issued to</th><th>Qty</th><th>Date</th><th>Status</th></tr>'+data.loans.filter(l=>JSON.stringify(l).toLowerCase().includes(q)).map(l=>'<tr><td>'+esc(data.items.find(i=>i.id===l.itemId)?.name||l.itemId)+'</td><td>'+esc(l.member)+'</td><td>'+l.qty+'</td><td>'+esc(l.date)+'</td><td>'+(l.returned?'Returned':'<button onclick="returnLoan(\''+l.id+'\')">Return</button>')+'</td></tr>').join('')+'</table>'}else{table.innerHTML='<table><tr><th>Incoming item</th><th>Quantity</th><th>Status</th><th>Action</th></tr>'+data.orders.filter(o=>JSON.stringify(o).toLowerCase().includes(q)).map(o=>'<tr><td>'+esc(o.name)+'</td><td>'+o.qty+'</td><td>'+esc(o.status)+'</td><td>'+(o.status==='Received'?'Received':'<button onclick="receive(\''+o.id+'\')">Receive</button>')+'</td></tr>').join('')+'</table>'}}
function showForm(title,fields){modalTitle.textContent=title;document.getElementById('fields').innerHTML=fields;modal.showModal()}function f(id,label,type='text',extra=''){return '<label>'+label+'</label><input name="'+id+'" type="'+type+'" '+extra+' required>'}
function openAdd(){mode=tab==='orders'?'order':'add';showForm(mode==='order'?'New incoming order':'New inventory item',f('name','Item description')+(mode==='order'?f('qty','Quantity','number','min="1"'):f('category','Category')+f('total','Total quantity','number','min="0"')))}function openCheckout(id){let item=data.items.find(i=>i.id===id);if(item.total-active(id)<=0)return alert('No stock available');selected=id;mode='checkout';showForm('Issue '+item.name,f('member','Last name')+f('qty','Quantity','number','min="1" max="'+(item.total-active(id))+'"'))}function submitForm(e){e.preventDefault();let x=Object.fromEntries(new FormData(e.target));if(mode==='add'){data.items.push({id:'EQ-'+Date.now(),name:x.name,category:x.category,total:Number(x.total)})}else if(mode==='order'){data.orders.push({id:'PO-'+Date.now(),name:x.name,qty:Number(x.qty),status:'Ordered'})}else{let n=Number(x.qty);let i=data.items.find(i=>i.id===selected);if(!i||n<=0||n>i.total-active(i.id))return alert('Insufficient stock');data.loans.push({id:'LN-'+Date.now(),itemId:selected,member:x.member,qty:n,date:today(),returned:false})}modal.close();save()}function returnLoan(id){let l=data.loans.find(x=>x.id===id);if(l){l.returned=true;save()}}function receive(id){let o=data.orders.find(x=>x.id===id);if(o&&! (o.status==='Received')){let i=data.items.find(i=>i.name.toLowerCase()===o.name.toLowerCase());if(i)i.total+=o.qty;else data.items.push({id:'EQ-'+Date.now(),name:o.name,category:'Incoming',total:o.qty});o.status='Received';save()}}function reset(){if(confirm('Reset fictional demo data?')){data=structuredClone(seed);save()}}function exportCSV(){let rows=[['ID','Name','Category','Total'],...data.items.map(i=>[i.id,i.name,i.category,i.total])];let csv=rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\n'),u=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));let a=document.createElement('a');a.href=u;a.download='demo-inventory.csv';a.click();URL.revokeObjectURL(u)}render();
</script></body></html>
